schema_version: 1
robot:
  group: arm
  base_frame: base_link
  tool_frame: gripper_center
  joint_names:
  - joint1
  - joint2
  - joint3
  - joint4
  - joint5
  - joint6
  default_ik_seed:
  - 0.0
  - 0.18
  - 0.18
  - 0.0
  - 0.0
  - 0.0
defaults:
  # Smooth production profile. Segment overrides keep long transfers fast and
  # lower speed only where the process needs precise vertical/wrist motion.
  velocity_scale: 0.85
  acceleration_scale: 0.85
  # Bound the peak jerk of the controller's quintic spline interpolation.
  max_jerk_rad_sec3: 300.0
  joint_step_rad: 0.10
  cartesian_step_m: 0.010
  max_joint_jump_rad: 0.35
  max_lateral_error_m: 0.001
  ik_timeout_sec: 0.1
  ik_attempts: 20
points:
  home_near:
    description: 机械臂近零位，仅用于维护和关机回位。
    joints:
    - -0.006
    - 0.0
    - 0.012
    - -0.072
    - -0.006
    - 0.034
    tags:
    - system
    - recovery
    - advanced
  safe_joint_center:
    description: 已有安全关节位，仅用于初始化、复位和异常恢复。
    joints:
    - 0.0
    - 0.18
    - 0.18
    - 0.0
    - 0.0
    - 0.0
    tags:
    - system
    - recovery
    - advanced
  outlet_wait:
    description: 两个出料口之间的高位等待点；正常循环不回安全关节位。
    pose:
      xyz:
      - 0.03
      - -0.35
      - 0.45
      rpy:
      - 0.0
      - 0.0
      - -1.5708
    ik_seed: safe_joint_center
    tags:
    - outlet
    - safety
    - advanced
  outlet_1_hover:
    description: 出料口1夹取点正上方的垂直进退点。
    pose:
      xyz:
      - -0.024
      - -0.44
      - 0.45
      rpy:
      - 0.0
      - 0.0
      - -1.5708
    ik_seed: outlet_wait
    tags:
    - outlet
    - safety
    - advanced
  outlet_1_grasp:
    description: 出料口1实际夹取/放回点；日常只调这个点。
    pose:
      xyz:
      - -0.024
      - -0.44
      - 0.16
      rpy:
      - 0.0
      - 0.0
      - -1.5708
    ik_seed: outlet_1_hover
    tags:
    - process
    - outlet
    - tunable
  outlet_1_pregrasp:
    description: 出料口1夹取点正上方10mm；最终精确接近的起点。
    pose:
      xyz:
      - -0.024
      - -0.44
      - 0.17
      rpy:
      - 0.0
      - 0.0
      - -1.5708
    ik_seed: outlet_1_hover
    tags:
    - outlet
    - precision_approach
    - advanced
  outlet_2_hover:
    description: 出料口2夹取点正上方的垂直进退点。
    pose:
      xyz:
      - 0.155
      - -0.42853
      - 0.45
      rpy:
      - 0.0
      - 0.0
      - -1.5708
    ik_seed: outlet_wait
    tags:
    - outlet
    - safety
    - advanced
  outlet_2_grasp:
    description: 出料口2实际夹取/放回点；日常只调这个点。
    pose:
      xyz:
      - 0.155
      - -0.42853
      - 0.16
      rpy:
      - 0.0
      - 0.0
      - -1.5708
    ik_seed: outlet_2_hover
    tags:
    - process
    - outlet
    - tunable
  outlet_2_pregrasp:
    description: 出料口2夹取点正上方10mm；最终精确接近的起点。
    pose:
      xyz:
      - 0.155
      - -0.42853
      - 0.17
      rpy:
      - 0.0
      - 0.0
      - -1.5708
    ik_seed: outlet_2_hover
    tags:
    - outlet
    - precision_approach
    - advanced
  spectrometer_hover:
    description: 光谱仪工艺点正上方；放杯后直接在这里等待检测。
    pose:
      xyz:
      - 0.595
      - -0.132
      - 0.45
      rpy:
      - 0.0
      - 0.0
      - 0.0
    ik_seed: outlet_2_hover
    tags:
    - spectrometer
    - safety
    - advanced
  spectrometer_pick_hover:
    description: 光谱仪取杯点正上方；独立于放杯上方点，保证取杯垂直进出。
    pose:
      xyz:
      - 0.600
      - -0.132
      - 0.45
      rpy:
      - 0.0
      - 0.0
      - 0.0
    ik_seed: spectrometer_hover
    tags:
    - spectrometer
    - safety
    - advanced
  spectrometer_place:
    description: 固定工位光谱仪放杯点。
    pose:
      xyz:
      - 0.595
      - -0.132
      - 0.33
      rpy:
      - 0.0
      - 0.0
      - 0.0
    ik_seed: spectrometer_hover
    tags:
    - process
    - spectrometer
    - tunable
  spectrometer_preplace:
    description: 光谱仪放杯点正上方10mm；最终精确放置的起点。
    pose:
      xyz:
      - 0.595
      - -0.132
      - 0.34
      rpy:
      - 0.0
      - 0.0
      - 0.0
    ik_seed: spectrometer_hover
    tags:
    - spectrometer
    - precision_approach
    - advanced
  spectrometer_pick:
    description: 光谱仪取杯点；比放杯点低10mm。
    pose:
      xyz:
      - 0.600
      - -0.132
      - 0.312
      rpy:
      - 0.0
      - 0.0
      - 0.0
    ik_seed: spectrometer_hover
    tags:
    - process
    - spectrometer
    - tunable
  spectrometer_prepick:
    description: 光谱仪取杯点正上方10mm；最终精确夹取的起点。
    pose:
      xyz:
      - 0.600
      - -0.132
      - 0.322
      rpy:
      - 0.0
      - 0.0
      - 0.0
    ik_seed: spectrometer_hover
    tags:
    - spectrometer
    - precision_approach
    - advanced
  cleaning_transition_seed:
    description: 清洗区独立IK分支种子；调光谱仪点位时保持清洗轨迹关节分支不变。
    pose:
      xyz:
      - 0.57
      - -0.12
      - 0.45
      rpy:
      - 0.0
      - 0.0
      - 0.0
    ik_seed: outlet_2_hover
    tags:
    - system
    - ik_seed
  clean_hover:
    description: 清洗区域共享进退点。
    pose:
      xyz:
      - 0.2
      - 0.5
      - 0.45
      rpy:
      - 0.0
      - 0.0
      - 1.5708
    ik_seed: cleaning_transition_seed
    tags:
    - cleaning
    - safety
    - advanced
  clean_dump_hover:
    description: 新倒料点正上方的垂直进退点；倒料Y微调时与倒料点同步。
    pose:
      xyz:
      - 0.2
      - 0.45
      - 0.45
      rpy:
      - 0.0
      - 0.0
      - 1.5708
    ik_seed: clean_hover
    tags:
    - cleaning
    - safety
    - advanced
  clean_dump:
    description: 杯子倒料工艺点。
    pose:
      xyz:
      - 0.2
      - 0.45
      - 0.2
      rpy:
      - 0.0
      - 0.0
      - 1.5708
    ik_seed: clean_hover
    tags:
    - process
    - cleaning
    - tunable
    tags:
    - system
    - recovery
    - advanced
  clean_dump_pour:
    description: 倒料点保持位置并将杯子转到已验证的负向倒料姿态。
    pose:
      xyz:
      - 0.2
      - 0.45
      - 0.2
      rpy:
      - -2.5
      - 0.0
      - 1.5708
    ik_seed: clean_dump
    tags:
    - cleaning
    - fixed_sequence
    - advanced
  clean_dump_shake_relief:
    description: 倒料限位回退0.4rad的单次抖料点。
    pose:
      xyz:
      - 0.2
      - 0.45
      - 0.2
      rpy:
      - -2.1
      - 0.0
      - 1.5708
    ik_seed: clean_dump_pour
    tags:
    - cleaning
    - fixed_sequence
    - advanced
  brush_entry:
    description: 已实机确认的固定毛刷入口；不随倒料点微调联动。
    pose:
      xyz:
      - 0.2
      - 0.55
      - 0.2
      rpy:
      - -2.49999946
      - 0.00000084
      - 1.570802
    ik_seed: clean_dump_pour
    tags:
    - cleaning
    - safety
    - advanced
  brush_clear_high:
    description: 毛刷退出后先垂直抬升到此高度，再跨区返回，避免低位经过光谱仪。
    pose:
      xyz:
      - 0.2
      - 0.55
      - 0.45
      rpy:
      - -2.49999946
      - 0.00000084
      - 1.570802
    ik_seed: brush_entry
    tags:
    - system
    - cleaning
    - safety
    - advanced
  brush_center:
    description: 从毛刷入口沿倒料姿态的杯体轴线下套100mm后的清洁点。
    pose:
      xyz:
      - 0.140153
      - 0.55
      - 0.119886
      rpy:
      - -2.49999946
      - 0.00000084
      - 1.570802
    ik_seed: brush_entry
    tags:
    - process
    - cleaning
    - tunable
routes:
  home_to_spectrometer_pick_recovery:
    start: home_near
    segments:
    - name: leave_home_via_safe_center
      type: joint
      to: safe_joint_center
      velocity_scale: 1.00
      acceleration_scale: 1.00
    - name: transfer_above_spectrometer_pick
      type: joint
      to: spectrometer_pick_hover
      velocity_scale: 1.00
      acceleration_scale: 1.00
    - name: vertical_approach_spectrometer_pick
      type: linear
      to: spectrometer_prepick
      velocity_scale: 1.00
      acceleration_scale: 1.00
      constraints:
        vertical_axis: z
        keep_orientation: true
    - name: precision_pick_spectrometer
      type: linear
      to: spectrometer_pick
      velocity_scale: 0.40
      acceleration_scale: 0.40
      constraints:
        vertical_axis: z
        keep_orientation: true
  home_to_clean_hover_recovery:
    start: home_near
    segments:
    - name: leave_home_via_safe_center
      type: joint
      to: safe_joint_center
      velocity_scale: 0.60
      acceleration_scale: 0.40
    - name: transfer_to_cleaning_hover
      type: joint
      to: clean_hover
      velocity_scale: 0.60
      acceleration_scale: 0.40
  home_to_clean_dump_recovery:
    start: home_near
    segments:
    - name: leave_home_via_safe_center
      type: joint
      to: safe_joint_center
      velocity_scale: 0.60
      acceleration_scale: 0.40
    - name: transfer_to_cleaning_hover
      type: joint
      to: clean_dump_hover
      velocity_scale: 0.60
      acceleration_scale: 0.40
    - name: vertical_enter_dump
      type: linear
      to: clean_dump
      velocity_scale: 0.55
      acceleration_scale: 0.45
      constraints:
        vertical_axis: z
        keep_orientation: true
  home_to_safe_center:
    start: home_near
    velocity_scale: 0.65
    acceleration_scale: 0.65
    segments:
    - name: recover_to_safe
      type: joint
      to: safe_joint_center
  safe_center_to_home:
    start: safe_joint_center
    velocity_scale: 0.65
    acceleration_scale: 0.65
    segments:
    - name: maintenance_home
      type: joint
      to: home_near
  safe_center_to_outlet_wait:
    start: safe_joint_center
    segments:
    - name: enter_production_wait
      type: joint
      to: outlet_wait
  outlet_wait_to_safe_center:
    start: outlet_wait
    segments:
    - name: leave_production_area
      type: joint
      to: safe_joint_center
  outlet_wait_to_outlet_1_grasp:
    start: outlet_wait
    segments:
    - name: transfer_above_outlet_1
      type: joint
      to: outlet_1_hover
      velocity_scale: 0.85
      acceleration_scale: 0.85
    - name: vertical_approach_outlet_1
      type: linear
      to: outlet_1_pregrasp
      velocity_scale: 0.55
      acceleration_scale: 0.45
      constraints:
        vertical_axis: z
        keep_orientation: true
    - name: precision_grasp_outlet_1
      type: linear
      to: outlet_1_grasp
      velocity_scale: 0.25
      acceleration_scale: 0.20
      constraints:
        vertical_axis: z
        keep_orientation: true
  outlet_wait_to_outlet_2_grasp:
    start: outlet_wait
    segments:
    - name: transfer_above_outlet_2
      type: joint
      to: outlet_2_hover
      velocity_scale: 0.85
      acceleration_scale: 0.85
    - name: vertical_approach_outlet_2
      type: linear
      to: outlet_2_pregrasp
      velocity_scale: 0.55
      acceleration_scale: 0.45
      constraints:
        vertical_axis: z
        keep_orientation: true
    - name: precision_grasp_outlet_2
      type: linear
      to: outlet_2_grasp
      velocity_scale: 0.25
      acceleration_scale: 0.20
      constraints:
        vertical_axis: z
        keep_orientation: true
  outlet_1_grasp_to_spectrometer_place:
    start: outlet_1_grasp
    segments:
    - name: precision_lift_outlet_1
      type: linear
      to: outlet_1_pregrasp
      velocity_scale: 0.50
      acceleration_scale: 0.45
      constraints:
        vertical_axis: z
        keep_orientation: true
    - name: vertical_lift_outlet_1
      type: linear
      to: outlet_1_hover
      velocity_scale: 0.80
      acceleration_scale: 0.70
      constraints:
        vertical_axis: z
        keep_orientation: true
    - name: transfer_to_spectrometer
      type: joint
      to: spectrometer_hover
      velocity_scale: 0.85
      acceleration_scale: 0.85
    - name: vertical_approach_spectrometer_place
      type: linear
      to: spectrometer_preplace
      velocity_scale: 0.55
      acceleration_scale: 0.45
      constraints:
        vertical_axis: z
        keep_orientation: true
    - name: precision_place_spectrometer
      type: linear
      to: spectrometer_place
      velocity_scale: 0.25
      acceleration_scale: 0.20
      constraints:
        vertical_axis: z
        keep_orientation: true
  outlet_1_grasp_to_hover_fast:
    start: outlet_1_grasp
    velocity_scale: 1.00
    acceleration_scale: 1.00
    segments:
    - name: release_clearance_outlet_1
      type: linear
      to: outlet_1_pregrasp
      constraints:
        vertical_axis: z
        keep_orientation: true
    - name: vertical_lift_outlet_1
      type: linear
      to: outlet_1_hover
      constraints:
        vertical_axis: z
        keep_orientation: true
  outlet_1_hover_to_spectrometer_place:
    start: outlet_1_hover
    velocity_scale: 0.85
    acceleration_scale: 0.85
    segments:
    - name: transfer_to_spectrometer
      type: joint
      to: spectrometer_hover
    - name: vertical_approach_spectrometer_place
      type: linear
      to: spectrometer_preplace
      velocity_scale: 0.55
      acceleration_scale: 0.45
      constraints:
        vertical_axis: z
        keep_orientation: true
    - name: precision_place_spectrometer
      type: linear
      to: spectrometer_place
      velocity_scale: 0.25
      acceleration_scale: 0.20
      constraints:
        vertical_axis: z
        keep_orientation: true
  outlet_2_grasp_to_spectrometer_place:
    start: outlet_2_grasp
    segments:
    - name: precision_lift_outlet_2
      type: linear
      to: outlet_2_pregrasp
      velocity_scale: 0.30
      acceleration_scale: 0.25
      constraints:
        vertical_axis: z
        keep_orientation: true
    - name: vertical_lift_outlet_2
      type: linear
      to: outlet_2_hover
      velocity_scale: 0.55
      acceleration_scale: 0.45
      constraints:
        vertical_axis: z
        keep_orientation: true
    - name: transfer_to_spectrometer
      type: joint
      to: spectrometer_hover
      velocity_scale: 0.85
      acceleration_scale: 0.85
    - name: vertical_approach_spectrometer_place
      type: linear
      to: spectrometer_preplace
      velocity_scale: 0.55
      acceleration_scale: 0.45
      constraints:
        vertical_axis: z
        keep_orientation: true
    - name: precision_place_spectrometer
      type: linear
      to: spectrometer_place
      velocity_scale: 0.25
      acceleration_scale: 0.20
      constraints:
        vertical_axis: z
        keep_orientation: true
  spectrometer_place_to_hover:
    start: spectrometer_place
    segments:
    - name: precision_leave_after_place
      type: linear
      to: spectrometer_preplace
      velocity_scale: 0.30
      acceleration_scale: 0.25
      constraints:
        vertical_axis: z
        keep_orientation: true
    - name: vertical_leave_after_place
      type: linear
      to: spectrometer_hover
      velocity_scale: 0.55
      acceleration_scale: 0.45
      constraints:
        vertical_axis: z
        keep_orientation: true
  spectrometer_hover_to_place:
    start: spectrometer_hover
    segments:
    - name: vertical_approach_spectrometer_place
      type: linear
      to: spectrometer_preplace
      velocity_scale: 0.55
      acceleration_scale: 0.45
      constraints:
        vertical_axis: z
        keep_orientation: true
    - name: precision_place_spectrometer
      type: linear
      to: spectrometer_place
      velocity_scale: 0.25
      acceleration_scale: 0.20
      constraints:
        vertical_axis: z
        keep_orientation: true
  spectrometer_hover_to_pick:
    start: spectrometer_hover
    segments:
    - name: align_above_spectrometer_pick
      type: joint
      to: spectrometer_pick_hover
      velocity_scale: 0.35
      acceleration_scale: 0.30
    - name: vertical_approach_spectrometer_pick
      type: linear
      to: spectrometer_prepick
      velocity_scale: 0.55
      acceleration_scale: 0.45
      constraints:
        vertical_axis: z
        keep_orientation: true
    - name: precision_pick_spectrometer
      type: linear
      to: spectrometer_pick
      velocity_scale: 0.25
      acceleration_scale: 0.20
      constraints:
        vertical_axis: z
        keep_orientation: true
  spectrometer_pick_to_hover:
    start: spectrometer_pick
    segments:
    - name: precision_lift_spectrometer
      type: linear
      to: spectrometer_prepick
      velocity_scale: 0.30
      acceleration_scale: 0.25
      constraints:
        vertical_axis: z
        keep_orientation: true
    - name: vertical_lift_spectrometer
      type: linear
      to: spectrometer_pick_hover
      velocity_scale: 0.55
      acceleration_scale: 0.45
      constraints:
        vertical_axis: z
        keep_orientation: true
    - name: align_from_spectrometer_pick
      type: joint
      to: spectrometer_hover
      velocity_scale: 0.35
      acceleration_scale: 0.30
  spectrometer_pick_to_clean_dump:
    start: spectrometer_pick
    segments:
    - name: precision_lift_spectrometer
      type: linear
      to: spectrometer_prepick
      velocity_scale: 1.00
      acceleration_scale: 1.00
      constraints:
        vertical_axis: z
        keep_orientation: true
    - name: vertical_lift_spectrometer
      type: linear
      to: spectrometer_pick_hover
      velocity_scale: 1.00
      acceleration_scale: 1.00
      constraints:
        vertical_axis: z
        keep_orientation: true
    - name: transfer_to_cleaning
      type: joint
      to: clean_dump_hover
      velocity_scale: 1.00
      acceleration_scale: 1.00
    - name: vertical_enter_dump
      type: linear
      to: clean_dump
      velocity_scale: 1.00
      acceleration_scale: 1.00
      constraints:
        vertical_axis: z
        keep_orientation: true
  spectrometer_pick_to_pick_hover_fast:
    start: spectrometer_pick
    velocity_scale: 1.00
    acceleration_scale: 1.00
    segments:
    - name: release_clearance_spectrometer
      type: linear
      to: spectrometer_prepick
      constraints:
        vertical_axis: z
        keep_orientation: true
    - name: vertical_lift_spectrometer
      type: linear
      to: spectrometer_pick_hover
      constraints:
        vertical_axis: z
        keep_orientation: true
  spectrometer_pick_hover_to_clean_dump:
    start: spectrometer_pick_hover
    velocity_scale: 1.00
    acceleration_scale: 1.00
    segments:
    - name: transfer_to_cleaning
      type: joint
      to: clean_dump_hover
    - name: vertical_enter_dump
      type: linear
      to: clean_dump
      constraints:
        vertical_axis: z
        keep_orientation: true
  spectrometer_pick_to_brush_entry_smooth:
    start: spectrometer_pick
    velocity_scale: 1.00
    acceleration_scale: 1.00
    segments:
    - name: precision_lift_spectrometer
      type: linear
      to: spectrometer_prepick
      velocity_scale: 0.50
      acceleration_scale: 0.45
      constraints:
        vertical_axis: z
        keep_orientation: true
    - name: vertical_lift_spectrometer
      type: linear
      to: spectrometer_pick_hover
      constraints:
        vertical_axis: z
        keep_orientation: true
    - name: transfer_to_cleaning
      type: joint
      to: clean_dump_hover
    - name: vertical_enter_dump
      type: linear
      to: clean_dump
      constraints:
        vertical_axis: z
        keep_orientation: true
    - name: rotate_wrist_to_pour
      type: joint
      to: clean_dump_pour
      velocity_scale: 0.75
      acceleration_scale: 0.55
    - name: pour_shake_relief
      type: joint
      to: clean_dump_shake_relief
      velocity_scale: 0.55
      acceleration_scale: 0.45
    - name: pour_shake_back
      type: joint
      to: clean_dump_pour
      velocity_scale: 0.55
      acceleration_scale: 0.45
    - name: transfer_to_brush_entry
      type: joint
      to: brush_entry
      velocity_scale: 0.60
      acceleration_scale: 0.50
  clean_dump_to_pour:
    start: clean_dump
    velocity_scale: 1.00
    acceleration_scale: 1.00
    segments:
    - name: rotate_wrist_to_pour_limit
      type: joint
      to: clean_dump_pour
  clean_dump_pour_shake_once:
    start: clean_dump_pour
    velocity_scale: 0.45
    acceleration_scale: 0.45
    segments:
    - name: shake_relief
      type: joint
      to: clean_dump_shake_relief
    - name: shake_back_to_pour
      type: joint
      to: clean_dump_pour
  clean_dump_pour_to_clean_hover:
    start: clean_dump_pour
    velocity_scale: 0.70
    acceleration_scale: 0.70
    segments:
    - name: leave_dump_without_upright_stop
      type: joint
      to: clean_hover
  clean_dump_pour_to_brush_entry:
    start: clean_dump_pour
