  laser_pick_example:
    steps:
      - name: wait for laser pose
        type: wait_for_pose
        source: laser_object
        timeout_sec: 3.0

      - name: move above laser object
        type: move_pose
        source: laser_object
        offset_xyz: [0.0, 0.0, 0.12]
        cartesian: false

  rs485_state_then_pick:
    steps:
      - name: wait for external object-ready signal
        type: wait_for_signal
        topic: /workflow/external_signal
        signal_name: station_state
        code: 1
        active: true
        timeout_sec: 30.0

      - name: run normal cup pick after signal
        type: wait_for_pose
        source: cup
        timeout_sec: 5.0

      - name: open gripper
        type: gripper
        position: 0.050
        duration_sec: 2.0

      - name: move to pre-grasp
        type: move_pose
        source: cup
        offset_xyz: [0.04, 0.0, 0.15]
        cartesian: false

  fixed_large_motion_demo:
    steps:
      - name: close gripper before large motion
        type: gripper
        position: 0.002
        duration_sec: 1.2

      - name: move to large right-up pose
        type: move_joint
        positions: [0.120, 0.160, 0.160, 0.000, 0.000, 0.320]

      - name: open gripper at right-up pose
        type: gripper
        position: 0.050
        duration_sec: 1.5

      - name: settle after open
        type: sleep
        seconds: 0.3

      - name: move to large left-up pose
        type: move_joint
        positions: [-0.080, 0.140, 0.140, 0.000, 0.000, -0.220]

      - name: close gripper at left-up pose
        type: gripper
        position: 0.002
        duration_sec: 1.5

      - name: move to center raised pose
        type: move_joint
        positions: [0.000, 0.180, 0.180, 0.000, 0.000, 0.000]

      - name: return near home
        type: move_joint
        positions: [0.000, 0.010, 0.010, 0.000, 0.000, 0.000]

      - name: final settle
        type: sleep
        seconds: 0.5

  gripper_open:
    steps:
      - name: open gripper
        type: gripper
        position: 0.050
        duration_sec: 1.2

  gripper_close:
    steps:
      - name: close gripper
        type: gripper
        position: 0.002
        duration_sec: 1.2

  arm_home:
    steps:
      - name: return near home
        type: move_joint
        positions: [0.000, 0.010, 0.010, 0.000, 0.000, 0.000]

