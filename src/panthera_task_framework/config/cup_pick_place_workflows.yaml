pose_sources:
  cup:
    topic: /detected_cup_pose
    max_age_sec: 1.0
  laser_object:
    topic: /laser/object_pose
    max_age_sec: 0.5

defaults:
  # Default posture is the current physical posture: gripper points to base_link +Y.
  orientation_xyzw: [0.0, 0.0, 0.0, 1.0]
  cartesian_eef_step: 0.005
  cartesian_jump_threshold: 0.0
  cartesian_min_fraction: 0.95

workflows:
  cup_pick_place:
    steps:
      - name: open gripper before pick
        type: gripper
        position: 0.050
        duration_sec: 1.2

      - name: move safe before outlet 1 pick
        type: move_joint
        positions: [0.000, 0.180, 0.180, 0.000, 0.000, 0.000]

      - name: moveJ outlet 1 high over cup
        type: move_pose
        position: [-0.02500, -0.42853, 0.180]
        orientation_xyzw: [0.0, 0.0, -0.707107, 0.707107]
        cartesian: false

      - name: moveJ outlet 1 reachable grasp height
        type: move_pose
        position: [-0.02500, -0.42853, 0.140]
        orientation_xyzw: [0.0, 0.0, -0.707107, 0.707107]
        cartesian: false

      - name: close gripper on cup
        type: gripper
        position: 0.002
        duration_sec: 1.5

      - name: moveJ lift from outlet 1
        type: move_pose
        position: [-0.02500, -0.42853, 0.180]
        orientation_xyzw: [0.0, 0.0, -0.707107, 0.707107]
        cartesian: false

      - name: move safe after outlet 1 pick
        type: move_joint
        positions: [0.000, 0.180, 0.180, 0.000, 0.000, 0.000]

      - name: moveJ spectrometer pre at laser 150mm
        type: move_pose
        position: [0.58414, -0.18517, 0.340]
        orientation_xyzw: [0.0, 0.0, 0.0, 1.0]
        cartesian: false

      - name: moveJ spectrometer place at laser 150mm
        type: move_pose
        position: [0.58414, -0.12103, 0.290]
        orientation_xyzw: [0.0, 0.0, 0.0, 1.0]
        cartesian: false

      - name: open gripper at spectrometer
        type: gripper
        position: 0.050
        duration_sec: 1.2

      - name: moveJ spectrometer retreat
        type: move_pose
        position: [0.58414, -0.18517, 0.340]
        orientation_xyzw: [0.0, 0.0, 0.0, 1.0]
        cartesian: false

      - name: move safe after spectrometer place
        type: move_joint
        positions: [0.000, 0.180, 0.180, 0.000, 0.000, 0.000]

      - name: moveJ spectrometer pre before pick
        type: move_pose
        position: [0.58414, -0.18517, 0.340]
        orientation_xyzw: [0.0, 0.0, 0.0, 1.0]
        cartesian: false

      - name: moveJ spectrometer pick at remeasured position
        type: move_pose
        position: [0.58414, -0.12103, 0.290]
        orientation_xyzw: [0.0, 0.0, 0.0, 1.0]
        cartesian: false

      - name: close gripper at spectrometer
        type: gripper
        position: 0.002
        duration_sec: 1.5

      - name: moveJ spectrometer retreat after pick
        type: move_pose
        position: [0.58414, -0.18517, 0.340]
        orientation_xyzw: [0.0, 0.0, 0.0, 1.0]
        cartesian: false

      - name: move safe after spectrometer pick
        type: move_joint
        positions: [0.000, 0.180, 0.180, 0.000, 0.000, 0.000]

      - name: moveJ clean ready
        type: move_pose
        position: [0.250, 0.400, 0.240]
        orientation_xyzw: [0.0, 0.0, 0.707107, 0.707107]
        cartesian: false

      - name: pour cup at clean station
        type: move_pose
        position: [0.250, 0.400, 0.120]
        orientation_xyzw: [-0.5, 0.5, 0.5, 0.5]
        cartesian: false

      - name: shake cup back
        type: move_pose
        position: [0.250, 0.400, 0.120]
        orientation_xyzw: [-0.45, 0.55, 0.45, 0.55]
        cartesian: false

      - name: upright cup after clean
        type: move_pose
        position: [0.250, 0.400, 0.240]
        orientation_xyzw: [0.0, 0.0, 0.707107, 0.707107]
        cartesian: false

      - name: move safe after clean
        type: move_joint
        positions: [0.000, 0.180, 0.180, 0.000, 0.000, 0.000]

      - name: moveJ outlet 1 return high
        type: move_pose
        position: [-0.02500, -0.42853, 0.180]
        orientation_xyzw: [0.0, 0.0, -0.707107, 0.707107]
        cartesian: false

      - name: moveJ outlet 1 return target
        type: move_pose
        position: [-0.02500, -0.42853, 0.140]
        orientation_xyzw: [0.0, 0.0, -0.707107, 0.707107]
        cartesian: false

      - name: release cup at outlet 1
        type: gripper
        position: 0.050
        duration_sec: 1.2

      - name: moveJ outlet 1 return high after release
        type: move_pose
        position: [-0.02500, -0.42853, 0.180]
        orientation_xyzw: [0.0, 0.0, -0.707107, 0.707107]
        cartesian: false

      - name: return near home
        type: move_joint
        positions: [0.000, 0.180, 0.180, 0.000, 0.000, 0.000]

